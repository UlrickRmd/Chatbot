<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::content})}">

<section th:fragment="content" class="login-page">

    <div class="login-card">

        <div class="login-logo">
            <h1>PakiSanIA</h1>
            <p>Bienvenue sur votre assistant intelligent</p>
        </div>

        <h2>Connexion</h2>
        <p th:if="${message}" th:text="${message}"
           class="alert alert-info">
        </p>

        <p class="login-description">
            Connectez-vous pour accéder à votre espace.
        </p>

        <form th:action="@{/connexion}" method="post">

            <div class="form-group-custom">

                <label for="email">Adresse e-mail</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com"
                        required
                >

            </div>

            <div class="form-group-custom">

                <label for="password">Mot de passe</label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        required
                >

            </div>

            <button type="submit" class="btn-primary-custom login-button">
                Se connecter
            </button>

        </form>

        <p class="login-back">
            <a th:href="@{/}">Retour à l'accueil</a>
        </p>

    </div>

</section>

</html>
