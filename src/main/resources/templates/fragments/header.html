<header th:fragment="header" class="main-header">

    <div class="header-container">

        <a th:href="@{/}" class="brand">
            <img th:src="@{/img/logo.png}"
                 alt="Logo PakiSanIA"
                 class="brand-logo">

            <span>PakiSanIA</span>
        </a>

        <nav class="header-navigation">

            <!-- Navigation : uniquement pour les utilisateurs connectés -->
            <th:block sec:authorize="isAuthenticated()">

                <!-- Informations sur l'utilisateur connecté -->
                <div class="user-info" th:if="${utilisateur != null}">
                    <span th:text="${utilisateur != null
                                    ? utilisateur.prenom + ' ' + utilisateur.nom
                                    : 'Anonyme'}">
                        Anonyme
                    </span>
                    <br>
                    <small th:text="${utilisateur != null
                                     ? utilisateur.role.nom
                                     : 'Visiteur'}">
                        Visiteur
                    </small>
                </div>

                <a th:href="@{/}" class="nav-link">
                    Accueil
                </a>

                <a th:href="@{/historique}" class="nav-link">
                    Historique
                </a>

                <!-- Déconnexion (POST + jeton CSRF ajouté par Thymeleaf) -->
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="btn btn-danger btn-sm">
                        Déconnexion
                    </button>
                </form>

            </th:block>

            <!-- Visiteur non connecté -->
            <a th:href="@{/login}" class="nav-link login-link"
               sec:authorize="isAnonymous()">
                Connexion
            </a>

        </nav>

    </div>

</header>
